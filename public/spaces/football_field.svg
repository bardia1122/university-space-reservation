<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="زمین فوتبال">
  <defs>
    <linearGradient id="ff-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="ff-grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#ff-sky)"/>
  <!-- stands -->
  <rect x="0" y="270" width="1200" height="90" fill="#1e40af" opacity="0.55"/>
  <rect x="0" y="300" width="1200" height="60" fill="#1d4ed8" opacity="0.4"/>
  <!-- floodlights -->
  <g fill="#dbeafe">
    <rect x="150" y="150" width="10" height="130"/>
    <rect x="120" y="120" width="70" height="36" rx="6"/>
    <rect x="1040" y="150" width="10" height="130"/>
    <rect x="1010" y="120" width="70" height="36" rx="6"/>
  </g>
  <g fill="#fef9c3" opacity="0.85">
    <circle cx="135" cy="130" r="5"/><circle cx="155" cy="130" r="5"/><circle cx="175" cy="130" r="5"/>
    <circle cx="1025" cy="130" r="5"/><circle cx="1045" cy="130" r="5"/><circle cx="1065" cy="130" r="5"/>
  </g>
  <!-- pitch -->
  <polygon points="0,360 1200,360 1200,750 0,750" fill="url(#ff-grass)"/>
  <!-- mow stripes -->
  <g fill="#15803d" opacity="0.5">
    <polygon points="0,360 1200,360 1200,420 0,440"/>
    <polygon points="0,500 1200,470 1200,540 0,580"/>
    <polygon points="0,640 1200,600 1200,680 0,750"/>
  </g>
  <!-- markings -->
  <g stroke="#f8fafc" stroke-width="5" fill="none" opacity="0.9">
    <line x1="600" y1="365" x2="600" y2="750"/>
    <ellipse cx="600" cy="560" rx="120" ry="60"/>
    <polyline points="120,750 120,610 380,610"/>
    <polyline points="1080,750 1080,610 820,610"/>
  </g>
  <!-- goal -->
  <g stroke="#f1f5f9" stroke-width="6" fill="none">
    <rect x="540" y="330" width="120" height="40"/>
  </g>
  <!-- ball -->
  <circle cx="600" cy="640" r="20" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
  <polygon points="600,628 610,636 606,648 594,648 590,636" fill="#1f2937"/>
</svg>

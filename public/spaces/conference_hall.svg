    <rect x="0" y="500" width="1200" height="66" fill="#243049"/>
    <rect x="0" y="588" width="1200" height="74" fill="#2b3a57"/>
    <rect x="0" y="684" width="1200" height="66" fill="#334263"/>
  </g>

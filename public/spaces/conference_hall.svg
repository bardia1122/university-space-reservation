  <g fill="#6366f1">
    <g>
      <circle cx="120" cy="448" r="14"/><circle cx="240" cy="448" r="14"/><circle cx="360" cy="448" r="14"/><circle cx="480" cy="448" r="14"/><circle cx="600" cy="448" r="14"/><circle cx="720" cy="448" r="14"/><circle cx="840" cy="448" r="14"/><circle cx="960" cy="448" r="14"/><circle cx="1080" cy="448" r="14"/>
    </g>
    <g fill="#818cf8">
      <circle cx="90" cy="532" r="15"/><circle cx="220" cy="532" r="15"/><circle cx="350" cy="532" r="15"/><circle cx="480" cy="532" r="15"/><circle cx="610" cy="532" r="15"/><circle cx="740" cy="532" r="15"/><circle cx="870" cy="532" r="15"/><circle cx="1000" cy="532" r="15"/><circle cx="1130" cy="532" r="15"/>
    </g>
    <g fill="#a5b4fc">
      <circle cx="120" cy="622" r="16"/><circle cx="260" cy="622" r="16"/><circle cx="400" cy="622" r="16"/><circle cx="540" cy="622" r="16"/><circle cx="680" cy="622" r="16"/><circle cx="820" cy="622" r="16"/><circle cx="960" cy="622" r="16"/><circle cx="1100" cy="622" r="16"/>

<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="سالن کنفرانس">
  <defs>
    <linearGradient id="ch-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="ch-stage" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#ch-bg)"/>
  <!-- stage light beams -->
  <g opacity="0.35">
    <polygon points="350,0 250,420 460,420" fill="#818cf8"/>
    <polygon points="850,0 740,420 950,420" fill="#818cf8"/>
    <polygon points="600,0 520,420 680,420" fill="#a5b4fc"/>
  </g>
  <!-- big screen -->
  <rect x="330" y="70" width="540" height="240" rx="8" fill="url(#ch-stage)"/>
  <rect x="330" y="70" width="540" height="240" rx="8" fill="none" stroke="#6366f1" stroke-width="4"/>
  <g fill="#c7d2fe" opacity="0.85">
    <rect x="380" y="130" width="300" height="22" rx="11"/>
    <rect x="380" y="172" width="420" height="14" rx="7"/>
    <rect x="380" y="204" width="360" height="14" rx="7"/>
  </g>
  <!-- stage -->
  <rect x="200" y="330" width="800" height="70" rx="8" fill="#312e81"/>
  <rect x="560" y="280" width="60" height="100" rx="6" fill="#4338ca"/>
  <!-- tiered seating -->

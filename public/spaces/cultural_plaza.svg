<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="پلاتوی فرهنگی">
  <defs>
    <linearGradient id="cp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="cp-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#cp-sky)"/>
  <!-- sun glow -->
  <circle cx="960" cy="190" r="90" fill="#fde68a" opacity="0.7"/>
  <!-- distant buildings -->
  <g fill="#6d28d9" opacity="0.45">
    <rect x="60" y="280" width="120" height="200"/>
    <rect x="200" y="240" width="90" height="240"/>
    <rect x="980" y="260" width="110" height="220"/>
    <rect x="1100" y="300" width="80" height="180"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="150" y="430" width="16" height="70" fill="#7c3aed"/>
    <circle cx="158" cy="420" r="44" fill="#22c55e"/>
    <rect x="1040" y="430" width="16" height="70" fill="#7c3aed"/>
    <circle cx="1048" cy="420" r="44" fill="#16a34a"/>
  </g>
  <!-- ground -->
  <rect x="0" y="480" width="1200" height="270" fill="url(#cp-ground)"/>
  <g stroke="#a78bfa" stroke-width="3" opacity="0.6">
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="650" x2="1200" y2="650"/>
    <line x1="300" y1="480" x2="180" y2="750"/>
    <line x1="600" y1="480" x2="600" y2="750"/>
    <line x1="900" y1="480" x2="1020" y2="750"/>
  </g>
  <!-- stage -->
  <rect x="430" y="360" width="340" height="130" rx="6" fill="#4c1d95"/>
  <rect x="430" y="350" width="340" height="22" rx="6" fill="#5b21b6"/>
  <!-- banner -->
  <rect x="470" y="250" width="260" height="80" rx="8" fill="#f472b6"/>
  <rect x="480" y="180" width="10" height="80" fill="#4c1d95"/>
  <rect x="710" y="180" width="10" height="80" fill="#4c1d95"/>
  <!-- bunting -->
  <g>
    <polyline points="490,250 600,275 710,250" stroke="#fbbf24" stroke-width="3" fill="none"/>
  </g>
  <!-- audience silhouettes -->
  <g fill="#5b21b6" opacity="0.8">
    <circle cx="360" cy="600" r="22"/><rect x="338" y="618" width="44" height="60" rx="12"/>
    <circle cx="470" cy="615" r="22"/><rect x="448" y="633" width="44" height="60" rx="12"/>
    <circle cx="730" cy="615" r="22"/><rect x="708" y="633" width="44" height="60" rx="12"/>
    <circle cx="840" cy="600" r="22"/><rect x="818" y="618" width="44" height="60" rx="12"/>
    <circle cx="600" cy="630" r="22"/><rect x="578" y="648" width="44" height="60" rx="12"/>
  </g>
</svg>

<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="زمین فوتسال سرپوشیده">
  <defs>
    <linearGradient id="fs-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="fs-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#fs-wall)"/>
  <!-- ceiling trusses -->
  <g stroke="#475569" stroke-width="6" opacity="0.7">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="150" y1="60" x2="220" y2="110"/>
    <line x1="350" y1="60" x2="420" y2="110"/>
    <line x1="550" y1="60" x2="620" y2="110"/>
    <line x1="750" y1="60" x2="820" y2="110"/>
    <line x1="950" y1="60" x2="1020" y2="110"/>
  </g>
  <!-- ceiling lights -->
  <g fill="#fde68a" opacity="0.9">
    <rect x="250" y="78" width="90" height="14" rx="4"/>
    <rect x="560" y="78" width="90" height="14" rx="4"/>
    <rect x="870" y="78" width="90" height="14" rx="4"/>
  </g>
  <!-- back wall ad band -->
  <rect x="0" y="200" width="1200" height="90" fill="#0f172a" opacity="0.5"/>
  <!-- court -->
  <polygon points="80,300 1120,300 1200,750 0,750" fill="url(#fs-floor)"/>
  <!-- court lines -->
  <g stroke="#e2e8f0" stroke-width="6" fill="none" opacity="0.9">
    <polygon points="120,330 1080,330 1160,720 40,720"/>
    <line x1="600" y1="330" x2="600" y2="720"/>
    <circle cx="600" cy="525" r="80"/>
    <polyline points="40,720 40,560 300,560 300,720"/>
    <polyline points="1160,720 1160,560 900,560 900,720"/>
  </g>
  <!-- goals -->
  <g stroke="#f8fafc" stroke-width="6" fill="none">
    <rect x="40" y="470" width="44" height="90"/>
    <rect x="1116" y="470" width="44" height="90"/>
  </g>
  <!-- ball -->
  <circle cx="600" cy="600" r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <polygon points="600,586 612,595 607,609 593,609 588,595" fill="#0f172a"/>
</svg>

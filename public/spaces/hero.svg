<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="نمای دانشگاه">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.6" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="h-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#h-sky)"/>
  <!-- soft light orbs -->
  <circle cx="1280" cy="180" r="220" fill="#60a5fa" opacity="0.25"/>
  <circle cx="280" cy="120" r="160" fill="#93c5fd" opacity="0.18"/>
  <!-- campus skyline -->
  <g opacity="0.9">
    <!-- left building -->
    <rect x="120" y="360" width="300" height="320" fill="#1e3a8a"/>
    <g fill="#3b82f6" opacity="0.6">
      <rect x="150" y="390" width="40" height="50"/><rect x="210" y="390" width="40" height="50"/><rect x="270" y="390" width="40" height="50"/><rect x="330" y="390" width="40" height="50"/>
      <rect x="150" y="470" width="40" height="50"/><rect x="210" y="470" width="40" height="50"/><rect x="270" y="470" width="40" height="50"/><rect x="330" y="470" width="40" height="50"/>
      <rect x="150" y="550" width="40" height="50"/><rect x="210" y="550" width="40" height="50"/><rect x="270" y="550" width="40" height="50"/><rect x="330" y="550" width="40" height="50"/>
    </g>
    <!-- central hall with dome/pediment -->
    <polygon points="560,300 800,210 1040,300" fill="#1e40af"/>
    <rect x="560" y="300" width="480" height="380" fill="#1e3a8a"/>
    <g fill="#bfdbfe" opacity="0.85">
      <rect x="610" y="340" width="22" height="120" rx="6"/><rect x="680" y="340" width="22" height="120" rx="6"/>
      <rect x="750" y="340" width="22" height="120" rx="6"/><rect x="820" y="340" width="22" height="120" rx="6"/>
      <rect x="890" y="340" width="22" height="120" rx="6"/><rect x="960" y="340" width="22" height="120" rx="6"/>
    </g>
    <rect x="560" y="320" width="480" height="14" fill="#bfdbfe" opacity="0.9"/>
    <g fill="#60a5fa" opacity="0.55">
      <rect x="600" y="500" width="60" height="80"/><rect x="700" y="500" width="60" height="80"/><rect x="800" y="500" width="60" height="80"/><rect x="900" y="500" width="60" height="80"/>
    </g>
    <!-- right tower -->
    <rect x="1180" y="320" width="240" height="360" fill="#1e40af"/>
    <g fill="#3b82f6" opacity="0.6">
      <rect x="1210" y="360" width="50" height="60"/><rect x="1290" y="360" width="50" height="60"/><rect x="1360" y="360" width="40" height="60"/>
      <rect x="1210" y="450" width="50" height="60"/><rect x="1290" y="450" width="50" height="60"/><rect x="1360" y="450" width="40" height="60"/>
      <rect x="1210" y="540" width="50" height="60"/><rect x="1290" y="540" width="50" height="60"/><rect x="1360" y="540" width="40" height="60"/>
    </g>
  </g>
  <!-- plaza ground -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#h-ground)"/>
  <g stroke="#3b82f6" stroke-width="3" opacity="0.4">
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="800" y1="680" x2="800" y2="900"/>
    <line x1="400" y1="680" x2="200" y2="900"/>
    <line x1="1200" y1="680" x2="1400" y2="900"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="470" y="600" width="14" height="90" fill="#1e3a8a"/><circle cx="477" cy="590" r="44" fill="#16a34a" opacity="0.85"/>
    <rect x="1110" y="600" width="14" height="90" fill="#1e3a8a"/><circle cx="1117" cy="590" r="40" fill="#22c55e" opacity="0.85"/>
  </g>
</svg>

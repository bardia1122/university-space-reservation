<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="غرفه نمایشگاهی">
  <defs>
    <linearGradient id="ex-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="ex-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#ex-bg)"/>
  <!-- ceiling grid -->
  <g stroke="#22d3ee" stroke-width="3" opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="200" y1="40" x2="200" y2="160"/>
    <line x1="500" y1="40" x2="500" y2="160"/>
    <line x1="800" y1="40" x2="800" y2="160"/>
    <line x1="1100" y1="40" x2="1100" y2="160"/>
  </g>
  <!-- floor -->
  <polygon points="0,470 1200,470 1200,750 0,750" fill="url(#ex-floor)"/>
  <!-- booth back panel -->
  <rect x="120" y="200" width="420" height="280" rx="6" fill="#f0f9ff"/>
  <rect x="120" y="200" width="420" height="60" fill="#0891b2"/>
  <g fill="#0e7490" opacity="0.7">
    <rect x="160" y="300" width="220" height="16" rx="8"/>
    <rect x="160" y="336" width="320" height="10" rx="5"/>
    <rect x="160" y="362" width="280" height="10" rx="5"/>
  </g>
  <rect x="170" y="216" width="180" height="28" rx="6" fill="#ecfeff"/>
  <!-- standing banner -->
  <rect x="640" y="170" width="120" height="310" rx="8" fill="#06b6d4"/>
  <g fill="#ecfeff" opacity="0.9">
    <circle cx="700" cy="240" r="34"/>
    <rect x="660" y="300" width="80" height="12" rx="6"/>
    <rect x="660" y="326" width="80" height="12" rx="6"/>
  </g>
  <!-- display stands -->
  <g fill="#0f766e">
    <rect x="840" y="360" width="120" height="120" rx="6"/>
    <rect x="1000" y="320" width="120" height="160" rx="6"/>
  </g>
  <rect x="855" y="375" width="90" height="60" rx="4" fill="#5eead4"/>
  <rect x="1015" y="335" width="90" height="80" rx="4" fill="#99f6e4"/>
  <!-- floor reflections -->
  <g stroke="#94a3b8" stroke-width="2" opacity="0.5">
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="650" x2="1200" y2="650"/>
  </g>
</svg>

<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="سالن سمینار">
  <defs>
    <linearGradient id="sh-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sh-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#eff6ff"/>
  <!-- front wall -->
  <rect x="0" y="0" width="1200" height="430" fill="url(#sh-wall)"/>
  <!-- ceiling lights -->
  <g fill="#fef9c3" opacity="0.85">
    <rect x="200" y="40" width="120" height="12" rx="4"/>
    <rect x="540" y="40" width="120" height="12" rx="4"/>
    <rect x="880" y="40" width="120" height="12" rx="4"/>
  </g>
  <!-- projector screen -->
  <rect x="360" y="90" width="480" height="250" rx="6" fill="#f8fafc"/>
  <rect x="360" y="90" width="480" height="250" rx="6" fill="#2563eb" opacity="0.12"/>
  <g fill="#2563eb" opacity="0.5">
    <rect x="400" y="140" width="280" height="18" rx="9"/>
    <rect x="400" y="180" width="360" height="12" rx="6"/>
    <rect x="400" y="210" width="320" height="12" rx="6"/>
  </g>
  <!-- podium -->
  <rect x="930" y="250" width="70" height="120" rx="6" fill="#1e3a8a"/>
  <!-- floor -->
  <polygon points="0,430 1200,430 1200,750 0,750" fill="url(#sh-floor)"/>
  <!-- seats: 3 rows -->
  <g>
    <g fill="#3b82f6">
      <rect x="120" y="470" width="130" height="60" rx="10"/><rect x="290" y="470" width="130" height="60" rx="10"/>
      <rect x="535" y="470" width="130" height="60" rx="10"/><rect x="780" y="470" width="130" height="60" rx="10"/>
      <rect x="950" y="470" width="130" height="60" rx="10"/>
    </g>
    <g fill="#2563eb">
      <rect x="90" y="560" width="140" height="66" rx="10"/><rect x="270" y="560" width="140" height="66" rx="10"/>
      <rect x="530" y="560" width="140" height="66" rx="10"/><rect x="790" y="560" width="140" height="66" rx="10"/>
      <rect x="970" y="560" width="140" height="66" rx="10"/>
    </g>
    <g fill="#1d4ed8">
      <rect x="60" y="660" width="150" height="72" rx="10"/><rect x="250" y="660" width="150" height="72" rx="10"/>
      <rect x="525" y="660" width="150" height="72" rx="10"/><rect x="800" y="660" width="150" height="72" rx="10"/>
      <rect x="990" y="660" width="150" height="72" rx="10"/>
    </g>
  </g>
</svg>
